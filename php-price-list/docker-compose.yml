services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: catalog
      MYSQL_DATABASE: catalog
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pcatalog"]
      interval: 3s
      timeout: 5s
      retries: 20
  app:
    build: .
    ports:
      - "8088:8080"
    environment:
      DATABASE_DSN: mysql:host=db;dbname=catalog;charset=utf8mb4
      DATABASE_USER: root
      DATABASE_PASSWORD: catalog
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
