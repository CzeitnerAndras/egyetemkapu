version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: egyetemkapu-db
    environment:
      POSTGRES_DB: egyetemkapu
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: egyetemkapu-backend
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/egyetemkapu
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_PROFILES_ACTIVE=prod
      - JWT_SECRET=${JWT_SECRET}
      - AI_API_KEY=${AI_API_KEY:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
    ports:
      - "8080:8080"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: egyetemkapu-frontend
    ports:
      - "80:80"
      # A 443 kell a HTTPS-hez, a 80 pedig marad: azon megy a Let's Encrypt
      # tanúsítvány-igénylés és a HTTP -> HTTPS átirányítás.
      - "443:443"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata: