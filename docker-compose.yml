services:
  db:
    image: postgres:15-alpine
    container_name: egyetemkapu-db
    environment:
      POSTGRES_DB: egyetemkapu
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: egyetemkapu-backend
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/egyetemkapu
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_PROFILES_ACTIVE=prod
      - JWT_SECRET=${JWT_SECRET}
      - AI_API_KEY=${AI_API_KEY:-nincs_megadva}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-nincs_megadva}
      - APP_PUBLIC_URL=${APP_PUBLIC_URL:-https://egyetemkapu.hu}
      - APP_TRUSTED_PROXIES=${APP_TRUSTED_PROXIES:-127.0.0.1,::1,172.30.60.10}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://egyetemkapu.hu,https://www.egyetemkapu.hu}
      - MAIL_HOST=${MAIL_HOST:-}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_FROM=${MAIL_FROM:-noreply@egyetemkapu.hu}
      - EMAIL_VERIFICATION_ENABLED=${EMAIL_VERIFICATION_ENABLED:-true}
      - TZ=Europe/Budapest
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./uploads:/app/uploads
    networks:
      - app
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: egyetemkapu-frontend
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      app:
        ipv4_address: 172.30.60.10
    depends_on:
      - backend
    restart: unless-stopped

networks:
  app:
    ipam:
      config:
        - subnet: 172.30.60.0/24

volumes:
  pgdata:
  caddy_data:
  caddy_config: