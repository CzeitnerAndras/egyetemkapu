version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: egyetemkapu-db
    environment:
      POSTGRES_DB: egyetemkapu
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: securepassword123
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: egyetemkapu-backend
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/egyetemkapu
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=securepassword123
      - SPRING_PROFILES_ACTIVE=prod
    ports:
      - "8080:8080"
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: egyetemkapu-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata: