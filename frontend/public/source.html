<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RUN:// SOURCE</title>
    <style>
        :root {
            --phosphor: #1cf85d;
            --phosphor-dim: rgba(28, 248, 93, 0.55);
            --crt-bg: #031e08;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #000;
            color: var(--phosphor);
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: var(--crt-bg);
            text-shadow: 0 0 6px rgba(28, 248, 93, 0.5);
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 12px 16px;
            border-bottom: 2px solid var(--phosphor);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            position: relative;
            z-index: 40;
        }

        header p {
            margin: 0;
            font-size: 18px;
        }

        #return-btn {
            color: var(--phosphor);
            background: transparent;
            border: none;
            font: inherit;
            font-size: 18px;
            text-transform: uppercase;
            text-shadow: inherit;
            cursor: pointer;
            padding: 4px 8px;
        }

        #return-btn:hover {
            background: var(--phosphor);
            color: #000;
            text-shadow: none;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 0;
            padding: 16px;
            position: relative;
            z-index: 1;
        }

        #game-container {
            position: relative;
            width: min(800px, 100%);
            aspect-ratio: 4 / 3;
            max-height: 100%;
            border: 2px solid var(--phosphor);
            box-shadow: 0 0 24px rgba(28, 248, 93, 0.35);
            overflow: hidden;
            background: #020f06;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(2, 15, 6, 0.88);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            text-align: center;
            padding: 24px;
        }

        .overlay h1 {
            margin: 0 0 16px;
            font-size: clamp(32px, 6vw, 56px);
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .overlay p {
            margin: 0;
            max-width: 34rem;
            color: var(--phosphor);
            line-height: 1.5;
            text-transform: uppercase;
        }

        .btn {
            margin-top: 24px;
            background: transparent;
            color: var(--phosphor);
            font-family: inherit;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            text-shadow: inherit;
            padding: 10px 28px;
            border: 2px solid var(--phosphor);
            cursor: pointer;
        }

        .btn:hover {
            background: var(--phosphor);
            color: #000;
            text-shadow: none;
        }

        #touch-controls {
            position: absolute;
            bottom: 16px;
            left: 0;
            width: 100%;
            padding: 0 16px;
            display: none;
            justify-content: space-between;
            z-index: 5;
            box-sizing: border-box;
        }

        .touch-btn {
            background: transparent;
            border: 2px solid var(--phosphor);
            width: 60px;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            color: var(--phosphor);
        }

        .touch-btn:active {
            background: var(--phosphor);
            color: #000;
        }

        .touch-group {
            display: flex;
            gap: 12px;
        }

        .crt-scanlines,
        .crt-vignette {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 30;
        }

        .crt-scanlines {
            background-image: linear-gradient(rgba(0, 0, 0, 0) 50%, rgba(0, 0, 0, 0.4) 50%);
            background-size: 100% 4px;
        }

        .crt-vignette {
            background: radial-gradient(circle at center, transparent 50%, rgba(0, 0, 0, 0.9) 100%);
        }

        @media (max-width: 850px) {
            #touch-controls { display: flex; }
            header p, #return-btn { font-size: 14px; }
        }
    </style>
</head>
<body>
    <header>
        <p>&gt; run:// source</p>
        <button id="return-btn" type="button">&lt;&lt; return</button>
    </header>

    <main>
        <div id="game-container">
            <canvas id="gameCanvas" width="800" height="600"></canvas>

            <div id="start-screen" class="overlay">
                <h1>Soul Escape</h1>
                <p>
                    Use WASD or arrow keys to move and jump.<br>
                    Avoid the acid. Reach the portal to win.
                </p>
                <button class="btn" id="start-btn" type="button">Start</button>
            </div>

            <div id="win-screen" class="overlay" style="display: none;">
                <h1>Victory</h1>
                <p>You escaped the dungeon.</p>
                <button class="btn" id="replay-btn" type="button">Play again</button>
            </div>

            <div id="touch-controls">
                <div class="touch-group">
                    <div class="touch-btn" id="btn-left" aria-label="left">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                    </div>
                    <div class="touch-btn" id="btn-right" aria-label="right">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                    </div>
                </div>
                <div class="touch-btn" id="btn-jump" aria-label="jump">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
                </div>
            </div>
        </div>
    </main>

    <div class="crt-scanlines"></div>
    <div class="crt-vignette"></div>

    <script src="/source-game.js"></script>
</body>
</html>
