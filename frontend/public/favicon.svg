<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100">
  <!-- 1. Teljes fehér háttér (ez adja a vastag fehér keretet minden irányba) -->
  <rect width="120" height="100" fill="white" />
  
  <!-- 2. Bordó belső téglalap (minden oldalról pontosan 10 egységnyi helyet hagyva a fehérnek) -->
  <rect x="10" y="10" width="100" height="80" fill="#800000" />
  
  <!-- 3. ƎK szöveg tökéletesen középre igazítva -->
  <text x="60" y="72" font-family="Arial, sans-serif" font-size="65" font-weight="bold" fill="white" text-anchor="middle">ƎK</text>
</svg>
